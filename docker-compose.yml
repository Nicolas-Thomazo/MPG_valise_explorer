services:
  mpg-explorer:
    container_name: mpg-explorer
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: mpg-explorer:latest
    volumes:
      - mpg_data:/app/data_kestra
    environment:
      DATA_PATH: /app/data_kestra
      MPG_USERNAME: ${MPG_USERNAME}
      MPG_PASSWORD: ${MPG_PASSWORD}
      LEAGUE_ID: ${LEAGUE_ID}
      TEAM_NAME: ${TEAM_NAME}
      SEASON_NUMBER: ${SEASON_NUMBER}
      DIVISION: ${DIVISION}
      NUMBER_PLAYERS: ${NUMBER_PLAYERS}
      USE_DOCKER: ${USE_DOCKER}
    command: ["python", "notebooks/scrap_league.py"]

volumes:
  mpg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MPG_DATA_PATH}